# ------------------------------------------------------------------
# Desktop Info - плашка ИТ сети (замена BGInfo)
#
# ID удалёнки и имя ОС с редакцией берутся из реестра HKCU\SOFTWARE\ITSETI\SupportIds.
# Их обновляет C:\ProgramData\ITSETI\update-support-ids.ps1 при каждом
# входе в систему - его запускает start-panel.vbs вместе с панелью.
#
# Кодировка файла: UTF-8 с BOM.
# Цвет с решёткой (#RRGGBB) - обычный RGB, без решётки - BGR.
# ------------------------------------------------------------------

[options]
# правый нижний угол, вплотную к краю рабочей области
bottom=5
right=2
width=360

# ширина колонки подписей
column1width=175

# шрифт
font-face=Segoe UI
font-size=11
line-spacing=2
font-quality=4

# фон
formcolor=000000
transparency=92

# поведение
nav=0
contextmenu=1
inimonitortime=1
noresults=(none)

[text]
menu-language=

[items]

set White = #FFFFFF

HOST=text:Имя компьютера,display:%1
USER=text:Имя пользователя,display:%1
BOOTTIME=text:Время запуска,display:%9 %10
UPTIME=interval:60,text:Время работы,display:%1 д %2 ч %3 мин
REG=interval:600,text:Версия ОС,value:HKCU\SOFTWARE\ITSETI\SupportIds\OsName,display:%1,no-result:Windows
PHYSICALRAM=interval:30,text:Оперативная память,display:%2[1.0g] ГБ (%3% занято)
NETWORKINTERFACES=interval:30,operstatus:1,iftype:6 71,row-text:%2,display:%8

COMMENT=interval:0,text: ,font-size:60%
COMMENT=interval:0,style:bu,color:%White%,text:Техническая поддержка
REG=interval:600,text:🌐 RMS,value:HKCU\SOFTWARE\ITSETI\SupportIds\RmsId,display:%1,no-result:не установлен
REG=interval:600,text:🌐 AnyDesk,value:HKCU\SOFTWARE\ITSETI\SupportIds\AnyDeskId,display:%1,no-result:не установлен
COMMENT=interval:0,text:☎ +7 (343) 243-57-63 (доб. 2)
COMMENT=interval:0,text:✉ support@it-seti.ru
COMMENT=interval:0,text:🕐 Пн-Пт 9:00-18:00