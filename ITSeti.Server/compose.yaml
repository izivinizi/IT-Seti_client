services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=2MB", "-c", "effective_cache_size=384MB"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  server:
    build:
      context: ..
      dockerfile: ITSeti.Server/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=25;Timeout=15;Command Timeout=30
      BootstrapAdminUser: ${BOOTSTRAP_ADMIN_USER:?Set BOOTSTRAP_ADMIN_USER}
      BootstrapAdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
      RegistrationPasswordHash: ${REGISTRATION_PASSWORD_HASH:-}
      OkdeskBaseUrl: ${OKDESK_BASE_URL:-https://it-seti.okdesk.ru}
      OkdeskApiToken: ${OKDESK_API_TOKEN:-}
      OkdeskTransport: ${OKDESK_TRANSPORT:-api}
      OkdeskLogin: ${OKDESK_LOGIN:-}
      OkdeskPassword: ${OKDESK_PASSWORD:-}
      OkdeskWebTicketDeliveryEnabled: ${OKDESK_WEB_TICKET_DELIVERY_ENABLED:-false}
      OkdeskCommentAuthorId: ${OKDESK_COMMENT_AUTHOR_ID:-}
      DataRoot: /data
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - app-data:/data
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
    mem_limit: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  postgres-data:
  app-data:
  caddy-data:
  caddy-config:
